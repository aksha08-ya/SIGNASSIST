# SIGNASSIST Streamlit & UI Configuration

app:
  title: "SIGNASSIST - Real-Time Indian Sign Language Recognition & Translation"
  theme: "dark"
  page_icon: "🤟"
  layout: "wide"

webcam:
  fps: 30
  width: 640
  height: 480
  mirror: true
  auto_start: false

display:
  show_landmarks: true
  show_confidence_bars: true
  show_bounding_box: true
  max_history_lines: 20

tts:
  enabled: true
  auto_play: false
  voice_gender: "female"
  speech_rate: 1.0

translation:
  nlp_smoothing: true
  min_confidence: 0.70
